name: build

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # Ассеты и эталоны тесты берут из оригинала (original/ не хранится в git)
      - name: Checkout original (SuperAnt30/Vge @ dfbd814)
        uses: actions/checkout@v4
        with:
          repository: SuperAnt30/Vge
          ref: dfbd814e47ed0e24e80f95e97f2d24e1d8bb182a
          path: original
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      # Тестовая сцена RHI на OpenGL и Vulkan (RenderBackendTests): на Linux без GPU её рисуют
      # Mesa llvmpipe (OpenGL) и lavapipe (Vulkan) в виртуальном X-сервере (GLFW из системы: загрузчик Silk.NET
      # на Linux не находит библиотеку из runtimes/linux-x64/native); на Windows без GPU тест пропускает бэкенд
      - name: Mesa software renderers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri mesa-vulkan-drivers libvulkan1 libx11-6 libxrandr2 libxinerama1 libxcursor1 libxi6 libxext6 libxkbcommon0 libglfw3
      - run: dotnet build MvkClaude.slnx -c Release
      - name: Test (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1920x1080x24" dotnet test MvkClaude.slnx -c Release --no-build
      - name: Render backends report (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1920x1080x24" dotnet test tests/Mvk.Platform.Tests -c Release --no-build --filter RenderBackendTests --logger "console;verbosity=detailed"
      - name: Test (Windows)
        if: runner.os != 'Linux'
        run: dotnet test MvkClaude.slnx -c Release --no-build
